<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>3D-Druck Bühnen · Vorschau</title>
<!--
  Vorschau-Version ohne Server: eine einzelne Seite, die alles im Browser des jeweiligen Geräts
  speichert (IndexedDB). Es gibt keine Anmeldung und keinen Abgleich zwischen Geräten.
  Die eigentliche App liegt unter src/ – diese Datei bildet nur ihre wichtigsten Abläufe nach.
-->
<style>
:root{--hg:#fafafa;--fl:#fff;--li:#e5e7eb;--tx:#111827;--gd:#6b7280;--ak:#2563eb;--akt:#fff;--akz:#eff6ff;--rot:#dc2626}
@media (prefers-color-scheme:dark){:root{--hg:#0f1113;--fl:#181b1f;--li:#2a2e34;--tx:#f3f4f6;--gd:#9ca3af;--ak:#60a5fa;--akt:#0f1113;--akz:#172033;--rot:#f87171}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--hg);color:var(--tx);font:16px/1.45 Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:.875rem;font-weight:500;color:var(--gd);margin:0}
p{margin:0}
main{max-width:64rem;margin:0 auto;padding:1.5rem 1rem 6.5rem}
nav.unten{position:fixed;inset:auto 0 0 0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--fl);border-top:1px solid var(--li);padding-bottom:env(safe-area-inset-bottom)}
nav.unten a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:3.5rem;font-size:11px;color:var(--gd)}
nav.seite{display:none}
nav a.aktiv{color:var(--ak);font-weight:500}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:768px){
  nav.unten{display:none}
  nav.seite{display:flex;flex-direction:column;gap:.25rem;position:fixed;inset:0 auto 0 0;width:14rem;padding:1.25rem .75rem;background:var(--fl);border-right:1px solid var(--li)}
  nav.seite b{padding:0 .75rem 1.25rem;font-size:.875rem}
  nav.seite a{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:.5rem;font-size:.875rem;color:var(--gd)}
  nav.seite a.aktiv{background:var(--akz)}
  .rahmen{padding-left:14rem}
  main{padding:2rem 2rem 2.5rem}
}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.5rem}
.klein{font-size:.875rem}.gd{color:var(--gd)}.zahl{font-variant-numeric:tabular-nums}
.karte{background:var(--fl);border:1px solid var(--li);border-radius:.75rem}
.pad{padding:1rem}
.zeilen>*+*{border-top:1px solid var(--li)}
.abschnitt{margin-top:2rem}
.abschnitt>.titel{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.75rem}
.knopf,.knopf2,.knopf3{display:inline-flex;align-items:center;justify-content:center;height:2.75rem;padding:0 1.25rem;border-radius:.5rem;border:1px solid transparent;font:inherit;font-size:.875rem;font-weight:500;cursor:pointer;white-space:nowrap}
.knopf{background:var(--ak);color:var(--akt)}
.knopf2,.knopf3{background:var(--fl);border-color:var(--li);color:var(--tx)}
.knopf3{height:2.25rem;padding:0 .75rem;font-weight:400}
.rot{color:var(--rot)}
input,select,textarea{display:block;width:100%;border:1px solid var(--li);border-radius:.5rem;background:var(--fl);color:var(--tx);font:inherit;padding:0 .75rem;outline:none}
input,select{height:2.75rem}
textarea{padding:.6rem .75rem;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ak)}
label{display:block;font-size:.875rem;font-weight:500}
label>input,label>select,label>textarea{margin-top:.25rem;font-weight:400}
label small{font-weight:400;color:var(--gd);margin-left:.35rem}
.raster{display:grid;gap:1rem}
.g2,.g3,.g6{display:grid;gap:.5rem}
.g3{grid-template-columns:repeat(3,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media (min-width:640px){.raster.zwei{grid-template-columns:1fr 1fr}.voll{grid-column:1/-1}.g2{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.spalten{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem}}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--li);border-radius:99px;padding:.1rem .65rem;font-size:.75rem;color:var(--gd)}
.chip i{width:.5rem;height:.5rem;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
a.chip.gross{height:2.25rem;padding:0 .9rem;font-size:.875rem;background:var(--fl)}
a.chip.an{border-color:var(--ak);background:var(--akz);color:var(--ak);font-weight:500}
.zeile{display:flex;gap:.75rem;align-items:center;padding:.75rem 1rem}
.zeile .mitte{flex:1;min-width:0}
.kurz{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:3.5rem;height:3.5rem;flex:none;border-radius:.5rem;border:1px solid var(--li);background:var(--hg);overflow:hidden}
.mini img,.galerie img{width:100%;height:100%;object-fit:cover;display:block}
.galerie{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
@media (min-width:640px){.galerie{grid-template-columns:repeat(4,1fr)}}
.galerie>div{position:relative;aspect-ratio:1;border-radius:.5rem;border:1px solid var(--li);overflow:hidden;background:var(--hg);cursor:zoom-in}
.galerie button{position:absolute;top:.25rem;right:.25rem}
.x{display:grid;place-items:center;width:2rem;height:2rem;border:0;border-radius:.5rem;background:none;color:var(--gd);font:inherit;cursor:pointer;flex:none}
.galerie .x{background:rgba(0,0,0,.55);color:#fff}
.kacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.kacheln b{display:block;font-size:1.6rem;font-weight:600}
.daten{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1.5rem;font-size:.875rem}
.leer{padding:3rem 1.5rem;text-align:center}
.hinweis{border-color:var(--ak);background:var(--akz);font-size:.875rem;margin-bottom:1rem}
.gross{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
.gross img{max-width:100%;max-height:100%}
details>summary{cursor:pointer;padding:.75rem 1rem;font-size:.875rem;font-weight:500}
.pre{white-space:pre-wrap}
</style>
</head>
<body>
<nav class="seite" id="nav-seite"></nav>
<div class="rahmen"><main id="app"></main></div>
<nav class="unten" id="nav-unten"></nav>

<script>
"use strict";

// ---------- Auswahlwerte (wie in der App: src/lib/werte.ts) ----------
const PRIO = { NIEDRIG: "Niedrig", MITTEL: "Mittel", HOCH: "Hoch", DRINGEND: "Dringend" };
const PRIO_FARBE = { NIEDRIG: "#9ca3af", MITTEL: "#3b82f6", HOCH: "#f97316", DRINGEND: "#ef4444" };
const PRIO_RANG = { DRINGEND: 0, HOCH: 1, MITTEL: 2, NIEDRIG: 3 };
const STATUS = { ANGEFRAGT: "Angefragt", IN_PLANUNG: "In Planung", KONSTRUKTION: "Konstruktion", DRUCKBEREIT: "Druckbereit", IM_DRUCK: "Im Druck", NACHBEARBEITUNG: "Nachbearbeitung", FERTIG: "Fertig", GELIEFERT: "Geliefert", PAUSIERT: "Pausiert", ABGEBROCHEN: "Abgebrochen" };
const ERLEDIGT = ["FERTIG", "GELIEFERT", "ABGEBROCHEN"];
const UMFANG = { KONSTRUKTION_UND_DRUCK: "Konstruktion + Druck", NUR_DRUCK: "Nur Druck" };
const MATERIAL = ["PLA", "PETG", "ABS", "ASA", "TPU", "Sonstiges"];
const SPARTEN = ["Oper", "Schauspiel", "Tanz", "Konzert", "Sonstiges"];
const STUECK_STATUS = { AKTIV: "Aktiv", IN_VORBEREITUNG: "In Vorbereitung", ABGESPIELT: "Abgespielt", ARCHIVIERT: "Archiviert" };
const EINHEITEN = ["mm", "cm", "m", "°"];

const START = () => ({
  naechsteId: 1,
  naechsteNummer: 1,
  stuecke: [],
  auftraege: [],
  eintraege: [],
  abteilungen: ["Beleuchtung", "Deko", "Maske", "Requisite", "Schlosserei", "Schneiderei", "Schreinerei", "Technik", "Ton"],
  kategorien: ["Kabelverschraubungen", "Steckverbinder", "Gewinde & Schrauben", "Rohre & Traversen", "Sonstiges"],
  drucker: [
    { id: "xl", name: "Prusa XL", bauraum: "360 × 360 × 360 mm · 2 Materialien gleichzeitig" },
    { id: "p1s", name: "Bambu Lab P1S", bauraum: "256 × 256 × 256 mm" },
  ],
});

// ---------- Speicher: IndexedDB im Browser dieses Geräts ----------
const speicher = new Promise((ok) => {
  try {
    const anfrage = indexedDB.open("druck-vorschau", 1);
    anfrage.onupgradeneeded = () => anfrage.result.createObjectStore("kv");
    anfrage.onsuccess = () => ok(anfrage.result);
    anfrage.onerror = () => ok(null);
  } catch { ok(null); }
});
async function kv(modus, zugriff) {
  const db = await speicher;
  if (!db) return undefined; // z. B. privater Modus: App läuft, vergisst aber alles beim Schließen
  return new Promise((ok, fehler) => {
    const t = db.transaction("kv", modus);
    const a = zugriff(t.objectStore("kv"));
    t.oncomplete = () => ok(a && a.result);
    t.onerror = () => fehler(t.error);
  });
}
const lesen = (k) => kv("readonly", (s) => s.get(k));
const schreiben = (k, v) => kv("readwrite", (s) => s.put(v, k));
const entfernen = (k) => kv("readwrite", (s) => s.delete(k));

let Z = START();
const sichern = () => schreiben("zustand", Z);
const neueId = () => Z.naechsteId++;

// ---------- Hilfen ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const zahl = (v) => { const t = String(v ?? "").trim().replace(",", "."); return t === "" || isNaN(Number(t)) ? null : Number(t); };
const fmt = (n) => (n == null ? "–" : new Intl.NumberFormat("de-DE", { maximumFractionDigits: 2 }).format(n));
const datum = (iso) => (iso ? new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–");
const datumZeit = (iso) => new Date(iso).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
const heute = () => new Date().toISOString().slice(0, 10);
const ueberfaellig = (a) => a.faelligAm && !ERLEDIGT.includes(a.status) && a.faelligAm < heute();
const statusFarbe = (s) => (s === "IM_DRUCK" ? "#2563eb" : s === "FERTIG" || s === "GELIEFERT" ? "#16a34a" : s === "PAUSIERT" || s === "ABGEBROCHEN" ? "#9ca3af" : "#f59e0b");
const optionen = (liste, gewaehlt, leer) =>
  (leer != null ? `<option value="">${esc(leer)}</option>` : "") +
  liste.map((o) => { const [w, n] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(w)}"${String(w) === String(gewaehlt ?? "") ? " selected" : ""}>${esc(n)}</option>`; }).join("");
const chip = (text, farbe) => `<span class="chip">${farbe ? `<i style="background:${esc(farbe)}"></i>` : ""}${esc(text)}</span>`;
const stueckVon = (a) => Z.stuecke.find((s) => s.id === a.stueckId);
const druckerVon = (a) => Z.drucker.find((d) => d.id === a.druckerId);
const sortiert = (liste) => [...liste].sort((a, b) => PRIO_RANG[a.prioritaet] - PRIO_RANG[b.prioritaet] || (a.faelligAm || "9").localeCompare(b.faelligAm || "9") || b.id - a.id);

// ---------- Bilder ----------
const bildUrls = new Map();
async function bildSpeichern(datei) {
  // Verkleinern spart Speicher: Handyfotos haben oft 12 Megapixel und mehr.
  const bild = await createImageBitmap(datei);
  const faktor = Math.min(1, 1600 / Math.max(bild.width, bild.height));
  const leinwand = document.createElement("canvas");
  leinwand.width = Math.round(bild.width * faktor);
  leinwand.height = Math.round(bild.height * faktor);
  leinwand.getContext("2d").drawImage(bild, 0, 0, leinwand.width, leinwand.height);
  const blob = await new Promise((ok) => leinwand.toBlob(ok, "image/jpeg", 0.82));
  const id = neueId();
  await schreiben("bild:" + id, blob);
  bildUrls.set(id, URL.createObjectURL(blob));
  return id;
}
async function bildLoeschen(id) {
  await entfernen("bild:" + id);
  bildUrls.delete(id);
}
async function bilderEinsetzen() {
  for (const img of document.querySelectorAll("img[data-bild]")) {
    const id = Number(img.dataset.bild);
    if (!bildUrls.has(id)) {
      const blob = await lesen("bild:" + id);
      if (blob) bildUrls.set(id, URL.createObjectURL(blob));
    }
    if (bildUrls.has(id)) img.src = bildUrls.get(id);
  }
}

// ---------- Bausteine ----------
const kopf = (titel, text, aktion) => `<header class="kopf"><div><h1>${esc(titel)}</h1>${text ? `<p class="klein gd" style="margin-top:.25rem">${esc(text)}</p>` : ""}</div>${aktion || ""}</header>`;
const abschnitt = (titel, inhalt, aktion) => `<section class="abschnitt"><div class="titel"><h2>${esc(titel)}</h2>${aktion || ""}</div>${inhalt}</section>`;
const leer = (titel, text) => `<div class="karte leer"><p style="font-weight:500">${esc(titel)}</p><p class="klein gd" style="margin-top:.25rem">${esc(text)}</p></div>`;
const feld = (label, inhalt, hinweis, klasse) => `<label class="${klasse || ""}">${esc(label)}${hinweis ? `<small>${esc(hinweis)}</small>` : ""}${inhalt}</label>`;
const eingabe = (name, wert, extra) => `<input name="${name}" value="${esc(wert ?? "")}" ${extra || ""}>`;

function auftragsListe(liste, ohneStueck) {
  return `<div class="karte zeilen">${liste.map((a) => {
    const d = druckerVon(a);
    return `<a class="zeile" href="#/auftraege/${a.id}" style="align-items:flex-start">
      <div class="mini">${a.bilder[0] ? `<img data-bild="${a.bilder[0]}" alt="">` : ""}</div>
      <div class="mitte">
        <div style="display:flex;justify-content:space-between;gap:.75rem"><span class="kurz" style="font-weight:500">${esc(a.titel)}</span><span class="klein gd zahl">${esc(a.nummer)}</span></div>
        <div class="klein gd kurz">${ohneStueck ? "" : esc(stueckVon(a)?.titel ?? "Allgemein")}${!ohneStueck && a.faelligAm ? " · " : ""}${a.faelligAm ? `<span class="${ueberfaellig(a) ? "rot" : ""}">bis ${datum(a.faelligAm)}${ueberfaellig(a) ? " (überfällig)" : ""}</span>` : ""}</div>
        <div class="chips" style="margin-top:.4rem">
          ${chip(STATUS[a.status] + (a.status === "IM_DRUCK" && d ? " · " + d.name : ""), statusFarbe(a.status))}
          ${chip(PRIO[a.prioritaet], PRIO_FARBE[a.prioritaet])}
          ${a.abteilung ? chip(a.abteilung) : ""}
          ${a.material || a.farbe || a.filamentG != null ? chip([a.material, a.farbe, a.filamentG != null ? fmt(a.filamentG) + " g" : null].filter(Boolean).join(" · ")) : ""}
        </div>
      </div></a>`;
  }).join("")}</div>`;
}

function massBereich(besitzer, art) {
  const inBibliothek = art === "eintrag";
  const zeilen = besitzer.masse.map((m) => `<div class="zeile" style="padding:.6rem 1rem">
      <div class="mitte"><div class="klein">${m.variante ? `<b style="margin-right:.5rem">${esc(m.variante)}</b>` : ""}${esc(m.bezeichnung)}</div>${m.notiz ? `<div class="gd kurz" style="font-size:.75rem">${esc(m.notiz)}</div>` : ""}</div>
      <div class="zahl" style="font-weight:500;user-select:all">${fmt(m.wert)} <span class="gd" style="font-weight:400">${esc(m.einheit)}</span></div>
      ${inBibliothek ? `<button class="x" style="border:1px solid ${m.geprueft ? "#16a34a" : "var(--li)"};color:${m.geprueft ? "#16a34a" : "var(--gd)"}" title="${m.geprueft ? "Nachgemessen / erprobt" : "Nur laut Datenblatt – antippen, wenn geprüft"}" data-klick="mass-geprueft" data-art="${art}" data-besitzer="${besitzer.id}" data-id="${m.id}">${m.geprueft ? "✓" : "?"}</button>` : ""}
      <button class="x" aria-label="Maß löschen" data-klick="mass-loeschen" data-art="${art}" data-besitzer="${besitzer.id}" data-id="${m.id}">✕</button>
    </div>`).join("");
  return `<div class="karte zeilen">
    ${zeilen || `<p class="pad klein gd">Noch keine Maße eingetragen.</p>`}
    <form class="pad" data-form="mass" data-art="${art}" data-besitzer="${besitzer.id}">
      <div class="g6">
        ${inBibliothek ? `<input class="s6" name="variante" placeholder="Variante (z. B. M20)" aria-label="Variante">` : ""}
        <input class="s6" name="bezeichnung" required placeholder="Bezeichnung" aria-label="Bezeichnung">
        <input class="s4" name="wert" required inputmode="decimal" placeholder="Wert" aria-label="Wert">
        <select class="s2" name="einheit" aria-label="Einheit">${optionen(EINHEITEN)}</select>
        <input class="s6" name="notiz" placeholder="Notiz (optional)" aria-label="Notiz">
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:.75rem">
        <button class="knopf2">Maß hinzufügen</button>
        ${inBibliothek ? `<label style="display:flex;align-items:center;gap:.5rem;font-weight:400"><input type="checkbox" name="geprueft" style="width:1rem;height:1rem">nachgemessen / erprobt</label>` : ""}
      </div>
    </form></div>`;
}

function bildBereich(besitzer, art) {
  return `<div class="karte pad">
    ${besitzer.bilder.length ? `<div class="galerie" style="margin-bottom:1rem">${besitzer.bilder.map((id) => `<div data-klick="bild-gross" data-id="${id}"><img data-bild="${id}" alt=""><button class="x" aria-label="Bild löschen" data-klick="bild-loeschen" data-art="${art}" data-besitzer="${besitzer.id}" data-id="${id}">✕</button></div>`).join("")}</div>` : `<p class="klein gd" style="margin-bottom:1rem">Noch keine Bilder.</p>`}
    <label class="knopf2" style="display:inline-flex">Foto / Bild hinzufügen<input type="file" accept="image/*" multiple hidden data-bilder="${art}" data-besitzer="${besitzer.id}"></label>
  </div>`;
}

// ---------- Seiten ----------
function seiteUebersicht() {
  const offen = sortiert(Z.auftraege.filter((a) => !ERLEDIGT.includes(a.status)));
  const kacheln = [["#/auftraege", offen.length, "Offene Aufträge"], ["#/stuecke", Z.stuecke.filter((s) => s.status !== "ARCHIVIERT").length, "Stücke"], ["#/bibliothek", Z.eintraege.length, "Einträge in der Maßbibliothek"]];
  return `<div class="karte pad hinweis"><b>Vorschau-Version.</b> Alles, was du hier einträgst, bleibt nur in diesem Browser auf diesem Gerät. Es gibt keinen Abgleich mit anderen Geräten und keine Sicherung.</div>
    ${kopf("3D-Druck Bühnen", "", `<a class="knopf" href="#/auftraege/neu">Neuer Auftrag</a>`)}
    <div class="kacheln">${kacheln.map(([h, n, t]) => `<a class="karte pad" href="${h}"><b class="zahl">${n}</b><span class="gd" style="font-size:.75rem">${t}</span></a>`).join("")}</div>
    ${abschnitt("Als Nächstes", offen.length ? auftragsListe(offen.slice(0, 6)) : leer("Keine offenen Aufträge", "Lege ein Stück an und erfasse den ersten Auftrag dazu."), offen.length > 6 ? `<a class="klein gd" href="#/auftraege" style="text-decoration:underline">Alle ${offen.length} anzeigen</a>` : "")}
    ${abschnitt("Drucker", druckerListe())}`;
}

function druckerListe() {
  return `<div class="karte zeilen">${Z.drucker.map((d) => {
    const laeuft = Z.auftraege.filter((a) => a.status === "IM_DRUCK" && a.druckerId === d.id);
    return `<div class="zeile" style="padding:1rem"><div class="mitte"><div style="font-weight:500">${esc(d.name)}</div><div class="klein gd">${esc(d.bauraum)}</div>
      ${laeuft.map((a) => `<a class="klein kurz" style="display:block;color:var(--ak);margin-top:.25rem" href="#/auftraege/${a.id}">druckt ${esc(a.nummer)} · ${esc(a.titel)}</a>`).join("")}</div>
      ${laeuft.length ? chip("Druckt", "#2563eb") : chip("Frei", "#16a34a")}</div>`;
  }).join("")}</div>`;
}

function seiteStuecke() {
  const liste = [...Z.stuecke].sort((a, b) => a.titel.localeCompare(b.titel, "de"));
  return kopf("Stücke", "Produktionen, zu denen Aufträge gehören.", `<a class="knopf" href="#/stuecke/neu">Neues Stück</a>`) +
    (liste.length ? `<div class="karte zeilen">${liste.map((s) => {
      const auftraege = Z.auftraege.filter((a) => a.stueckId === s.id);
      const offen = auftraege.filter((a) => !ERLEDIGT.includes(a.status)).length;
      return `<a class="zeile" href="#/stuecke/${s.id}"><div class="mitte"><div style="font-weight:500">${esc(s.titel)}</div><div class="klein gd kurz">${esc([s.sparte, s.spielzeit, s.premiere ? "Premiere " + datum(s.premiere) : null].filter(Boolean).join(" · ") || "–")}</div></div>

// ---------- Navigation und Anzeige ----------
const NAV = [["#/", "Übersicht", "M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"], ["#/stuecke", "Stücke", "M4 5h16v11H4zM8 20h8M12 16v4"], ["#/auftraege", "Aufträge", "M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"], ["#/bibliothek", "Maße", "M3 9h18v6H3zM7 9v3M11 9v3M15 9v3M19 9v3"], ["#/mehr", "Mehr", "M5 12h.01M12 12h.01M19 12h.01"]];

function anzeigen() {
  const [pfad, abfrage] = (location.hash.slice(1) || "/").split("?");
  const teile = pfad.split("/").filter(Boolean);
  const [bereich, zweites, drittes] = teile;
  const id = Number(zweites);
  let html;
  if (!bereich) html = seiteUebersicht();
  else if (bereich === "stuecke") {
    const s = Z.stuecke.find((x) => x.id === id);
    html = zweites === "neu" ? seiteStueckFormular() : s ? (drittes === "bearbeiten" ? seiteStueckFormular(s) : seiteStueck(s)) : seiteStuecke();
  } else if (bereich === "auftraege") {
    const a = Z.auftraege.find((x) => x.id === id);
    html = zweites === "neu" ? seiteAuftragFormular(null, new URLSearchParams(abfrage).get("stueck")) : a ? (drittes === "bearbeiten" ? seiteAuftragFormular(a) : seiteAuftrag(a)) : seiteAuftraege();
  } else if (bereich === "bibliothek") {
    const e = Z.eintraege.find((x) => x.id === id);
    html = zweites === "neu" ? seiteEintragFormular() : e ? (drittes === "bearbeiten" ? seiteEintragFormular(e) : seiteEintrag(e)) : seiteBibliothek();
  } else html = seiteMehr();

  document.getElementById("app").innerHTML = html;
  const aktiv = "#/" + (bereich || "");
  const punkte = NAV.map(([h, n, d]) => `<a href="${h}" class="${h === aktiv ? "aktiv" : ""}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${n}</a>`).join("");
  document.getElementById("nav-unten").innerHTML = punkte;
  document.getElementById("nav-seite").innerHTML = "<b>3D-Druck Bühnen</b>" + punkte;
  bilderEinsetzen();
}
const gehe = (hash) => { if (location.hash === hash) anzeigen(); else location.hash = hash; };
window.addEventListener("hashchange", () => { statusWahl = null; window.scrollTo(0, 0); anzeigen(); });

// ---------- Aktionen ----------
const besitzerVon = (art, id) => (art === "auftrag" ? Z.auftraege : Z.eintraege).find((x) => x.id === Number(id));

function statusSetzen(a, status, druckerId) {
  if (status === "IM_DRUCK" && !druckerId) return false;
  const vorher = a.status;
  a.druckerId = status === "IM_DRUCK" ? druckerId : null;
  if (vorher !== status) {
    a.status = status;
    a.notizen.unshift({ id: neueId(), art: "STATUS", zeit: new Date().toISOString(), text: `${STATUS[vorher]} → ${STATUS[status]}${status === "IM_DRUCK" ? ` (${druckerVon(a).name})` : ""}` });
  }
  return true;
}

const FORMULARE = {
  stueck(d, form) {
    const daten = { titel: d.titel.trim(), sparte: d.sparte, status: d.status, spielzeit: d.spielzeit.trim(), premiere: d.premiere, spielstaette: d.spielstaette.trim(), ansprechpersonen: d.ansprechpersonen.trim(), notizen: d.notizen.trim() };
    let s = Z.stuecke.find((x) => x.id === Number(form.dataset.id));
    if (s) Object.assign(s, daten); else Z.stuecke.push((s = { id: neueId(), ...daten }));
    return "#/stuecke/" + s.id;
  },
  auftrag(d, form) {
    const bestehend = Z.auftraege.find((x) => x.id === Number(form.dataset.id));
    if (d.status === "IM_DRUCK" && !d.druckerId) {
      const fehler = document.getElementById("formfehler");
      fehler.textContent = "Bitte den Drucker auswählen, auf dem gedruckt wird.";
      fehler.hidden = false;
      form.querySelector("details").open = true;
      return null;
    }
    const daten = { titel: d.titel.trim(), beschreibung: d.beschreibung.trim(), stueckId: Number(d.stueckId) || null, abteilung: d.abteilung, prioritaet: d.prioritaet, faelligAm: d.faelligAm, umfang: d.umfang, ansprechperson: d.ansprechperson.trim(), erhaltenAm: d.erhaltenAm || heute(), stueckzahl: zahl(d.stueckzahl) ?? 1, material: d.material, farbe: d.farbe.trim(), nachbearbeitung: d.nachbearbeitung.trim(),
      filamentG: zahl(d.filamentG), filamentIstG: zahl(d.filamentIstG), druckzeitH: zahl(d.druckzeitH), druckzeitIstH: zahl(d.druckzeitIstH), l: zahl(d.l), b: zahl(d.b), h: zahl(d.h) };
    let a = bestehend;
    if (a) Object.assign(a, daten);
    else Z.auftraege.push((a = { id: neueId(), nummer: "WB-" + Z.naechsteNummer++, status: "ANGEFRAGT", druckerId: null, masse: [], notizen: [], bilder: [], ...daten }));
    statusSetzen(a, d.status, d.druckerId);
    return "#/auftraege/" + a.id;
  },
  eintrag(d, form) {
    const daten = { titel: d.titel.trim(), kategorie: d.kategorie, quelle: d.quelle.trim(), beschreibung: d.beschreibung.trim(), druckhinweis: d.druckhinweis.trim(), schlagworte: d.schlagworte.trim() };
    let e = Z.eintraege.find((x) => x.id === Number(form.dataset.id));
    if (e) Object.assign(e, daten); else Z.eintraege.push((e = { id: neueId(), masse: [], bilder: [], ...daten }));
    return "#/bibliothek/" + e.id;
  },
  mass(d, form) {
    const wert = zahl(d.wert);
    if (wert == null) { form.wert.focus(); return null; }
    besitzerVon(form.dataset.art, form.dataset.besitzer).masse.push({ id: neueId(), variante: (d.variante || "").trim(), bezeichnung: d.bezeichnung.trim(), wert, einheit: d.einheit, notiz: d.notiz.trim(), geprueft: d.geprueft === "on" });
  },
  notiz(d, form) {
    Z.auftraege.find((x) => x.id === Number(form.dataset.id)).notizen.unshift({ id: neueId(), art: "NOTIZ", zeit: new Date().toISOString(), text: d.text.trim() });
  },
  uebernehmen(d, form) {
    // Bewusst eine Kopie: spätere Änderungen in der Bibliothek verändern den Auftrag nicht.
    const e = Z.eintraege.find((x) => x.id === Number(form.dataset.id));
    const a = Z.auftraege.find((x) => x.id === Number(d.auftragId));
    for (const m of e.masse.filter((x) => !d.variante || x.variante === d.variante)) {
      a.masse.push({ id: neueId(), bezeichnung: [m.variante, m.bezeichnung].filter(Boolean).join(" · "), wert: m.wert, einheit: m.einheit, notiz: m.notiz || "aus Bibliothek: " + e.titel });
    }
    return "#/auftraege/" + a.id;
  },
  liste(d, form) {
    const liste = Z[form.dataset.liste];
    const name = d.name.trim();
    if (name && !liste.includes(name)) liste.push(name);
  },
};

document.addEventListener("submit", async (ereignis) => {
  const form = ereignis.target.closest("form[data-form]");
  if (!form) return;
  ereignis.preventDefault();
  const ziel = FORMULARE[form.dataset.form](Object.fromEntries(new FormData(form)), form);
  if (ziel === null) return;
  await sichern();
  if (ziel) gehe(ziel); else anzeigen();
});

const KLICKS = {
  "mass-loeschen"(d) { const b = besitzerVon(d.art, d.besitzer); b.masse = b.masse.filter((m) => m.id !== Number(d.id)); },
  "mass-geprueft"(d) { const m = besitzerVon(d.art, d.besitzer).masse.find((x) => x.id === Number(d.id)); m.geprueft = !m.geprueft; },
  "notiz-loeschen"(d) { const a = Z.auftraege.find((x) => x.id === Number(d.besitzer)); a.notizen = a.notizen.filter((n) => n.id !== Number(d.id)); },
  async "bild-loeschen"(d) { if (!confirm("Dieses Bild löschen?")) return false; const b = besitzerVon(d.art, d.besitzer); b.bilder = b.bilder.filter((i) => i !== Number(d.id)); await bildLoeschen(Number(d.id)); },
  "bild-gross"(d) { const url = bildUrls.get(Number(d.id)); if (url) document.body.insertAdjacentHTML("beforeend", `<div class="gross" data-klick="gross-zu"><img src="${url}" alt=""></div>`); return false; },
  "gross-zu"() { document.querySelector(".gross")?.remove(); return false; },
  "status-uebernehmen"(d) {
    const a = Z.auftraege.find((x) => x.id === Number(d.id));
    if (!statusSetzen(a, "IM_DRUCK", document.getElementById("statusdrucker").value)) { document.getElementById("statusfehler").hidden = false; return false; }
    statusWahl = null;
  },
  "auftrag-duplizieren"(d) {
    const v = Z.auftraege.find((x) => x.id === Number(d.id));
    const kopie = { ...v, id: neueId(), nummer: "WB-" + Z.naechsteNummer++, titel: v.titel + " (Kopie)", status: "ANGEFRAGT", druckerId: null, filamentIstG: null, druckzeitIstH: null, erhaltenAm: heute(), bilder: [], notizen: [], masse: v.masse.map((m) => ({ ...m, id: neueId() })) };
    Z.auftraege.push(kopie);
    return "#/auftraege/" + kopie.id;
  },
  async "auftrag-loeschen"(d) {
    const a = Z.auftraege.find((x) => x.id === Number(d.id));
    if (!confirm(`Auftrag ${a.nummer} mit allen Bildern, Maßen und Notizen endgültig löschen?`)) return false;
    for (const id of a.bilder) await bildLoeschen(id);
    Z.auftraege = Z.auftraege.filter((x) => x !== a);
    return "#/auftraege";
  },
  async "eintrag-loeschen"(d) {
    const e = Z.eintraege.find((x) => x.id === Number(d.id));
    if (!confirm(`„${e.titel}“ mit allen Maßen und Bildern endgültig löschen?`)) return false;
    for (const id of e.bilder) await bildLoeschen(id);
    Z.eintraege = Z.eintraege.filter((x) => x !== e);
    return "#/bibliothek";
  },
  "bib-kategorie"(d) { bibFilter.kategorie = d.wert; },
  "liste-entfernen"(d) { Z[d.liste] = Z[d.liste].filter((w) => w !== d.wert); },
  async "alles-loeschen"() {
    if (!confirm("Wirklich alle Stücke, Aufträge, Maße und Bilder auf diesem Gerät löschen?")) return false;
    await kv("readwrite", (s) => s.clear());
    bildUrls.clear();
    Z = START();
    return "#/";
  },
};

document.addEventListener("click", async (ereignis) => {
  const knopf = ereignis.target.closest("[data-klick]");
  if (!knopf) return;
  ereignis.preventDefault();
  ereignis.stopPropagation();
  const ziel = await KLICKS[knopf.dataset.klick](knopf.dataset);
  if (ziel === false) return;
  await sichern();
  if (ziel) gehe(ziel); else anzeigen();
});

document.addEventListener("change", async (ereignis) => {
  const el = ereignis.target;
  if (el.id === "status") {
    const a = Z.auftraege.find((x) => x.id === Number(el.dataset.id));
    if (el.value === "IM_DRUCK") { statusWahl = "IM_DRUCK"; anzeigen(); return; } // erst Drucker wählen
    statusWahl = null;
    statusSetzen(a, el.value, null);
    await sichern();
    anzeigen();
  } else if (el.id === "statusdrucker") {
    const a = Z.auftraege.find((x) => x.id === Number(el.dataset.id));
    // Läuft der Druck schon, gilt ein Druckerwechsel sofort; sonst bestätigt „Übernehmen“.
    if (a.status === "IM_DRUCK" && el.value) { a.druckerId = el.value; await sichern(); anzeigen(); }
  } else if (el.id === "formstatus") {
    document.getElementById("formdrucker").hidden = el.value !== "IM_DRUCK";
  } else if (el.id === "statusfilter") {
    filter.status = el.value;
    document.getElementById("liste").innerHTML = auftraegeInhalt();
    bilderEinsetzen();
  } else if (el.dataset.bilder) {
    const b = besitzerVon(el.dataset.bilder, el.dataset.besitzer);
    el.closest("label").firstChild.textContent = "Wird gespeichert …";
    for (const datei of el.files) {
      try { b.bilder.push(await bildSpeichern(datei)); } catch { alert(`„${datei.name}“ konnte nicht gelesen werden.`); }
    }
    await sichern();
    anzeigen();
  }
});

document.addEventListener("input", (ereignis) => {
  // Nur die Liste neu aufbauen, damit das Suchfeld den Fokus behält.
  if (ereignis.target.id === "suche") { filter.q = ereignis.target.value; document.getElementById("liste").innerHTML = auftraegeInhalt(); bilderEinsetzen(); }
  if (ereignis.target.id === "bibsuche") { bibFilter.q = ereignis.target.value; document.getElementById("bibliste").innerHTML = bibInhalt(); bilderEinsetzen(); }
});

// ---------- Start ----------
lesen("zustand").catch(() => null).then((gespeichert) => {
  if (gespeichert) Z = { ...START(), ...gespeichert };
  anzeigen();
});
</script>
